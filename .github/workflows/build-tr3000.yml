name: Build Cudy TR3000 firmware

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "=== Before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af 2>/dev/null || true
          sudo apt-get clean
          sudo apt-get autoremove -y
          echo "=== After cleanup ==="
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd build-essential gawk wget file libssl-dev

      - name: Build firmware
        run: |
          chmod +x build-openwrtai-image.sh
          ./build-openwrtai-image.sh

      - name: Collect firmware files
        run: |
          mkdir -p outputs
          IB_DIR=$(find . -maxdepth 1 -type d -name 'openwrt-imagebuilder-*' | head -n1)
          if [ -n "$IB_DIR" ]; then
            echo ">> 从 $IB_DIR 复制固件..."
            cp -v "$IB_DIR/bin/targets/mediatek/filogic/"*.bin outputs/ 2>/dev/null || true
            cp -v "$IB_DIR/bin/targets/mediatek/filogic/"*.itb outputs/ 2>/dev/null || true
            cp -v "$IB_DIR/bin/targets/mediatek/filogic/sha256sums" outputs/ 2>/dev/null || true
          fi
          echo ">> outputs 目录内容:"
          ls -lh outputs/

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cudy-tr3000-firmware-${{ github.run_number }}
          path: outputs/*.bin
          retention-days: 7

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            build.log
            excluded_packages.txt
          retention-days: 3
